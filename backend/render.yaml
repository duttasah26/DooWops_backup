services:
  - type: web
    name: doowops-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: YOUTUBE_API_KEY
        sync: false
      # Comma-separated site addresses allowed to call the API; set it in the Render dashboard.
      - key: FRONTEND_URL
        sync: false
