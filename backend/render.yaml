services:
  - type: web
    name: doowops-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REDIRECT_URI
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      # Comma-separated site addresses allowed to call the API; the first is
      # where Spotify login sends people back. Set it in the Render dashboard.
      - key: FRONTEND_URL
        sync: false
